# Runs factory/checks.sh on every push to main (and on a manual run), then
# deploys the page's files plus sw.js to GitHub Pages. It runs in three jobs:
# test (the checks); upload (build, freshness check and artifact upload); and
# deploy (the deploy alone). The upload has its own job because an artifact
# uploaded in the same job can be missing when deploy-pages looks it up
# (actions/deploy-pages#451). A run whose commit is no longer the tip of main
# tests but skips publishing. The deploy runs only in the same attempt as the
# freshness check, so a deploy-only re-run publishes nothing.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bash factory/checks.sh

  upload:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      current: ${{ steps.fresh.outputs.current }}
      attempt: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node scripts/pages-site.js "$RUNNER_TEMP/site"
      - id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ -z "$tip" ]; then
            echo "Could not read the tip of main" >&2
            exit 1
          fi
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$GITHUB_SHA is no longer the tip of main ($tip): stale run, publishing skipped"
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.fresh.outputs.current == 'true'
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: upload
    if: github.ref == 'refs/heads/main' && needs.upload.outputs.current == 'true' && needs.upload.outputs.attempt == github.run_attempt
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
